name: Update Codeforces heatmap

on:
  push:
    branches:
      - main
    paths:
      - "800-level/**/*.py"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeforces-heatmap
  cancel-in-progress: true

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate heatmap
        run: python scripts/generate_codeforces_heatmap.py

      - name: Commit an updated heatmap
        run: |
          if git diff --quiet -- assets/codeforces-heatmap.svg; then
            echo "Heatmap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces-heatmap.svg
          git commit -m "Update Codeforces heatmap"
          git push
